            --highlight-green: #10b981; 
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 20px; color: var(--text-dark); user-select: none;
        }

        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { font-size: 24px; margin: 0; color: var(--text-dark); }
        .header p { color: var(--text-gray); margin-top: 8px; font-size: 13px; }

        .province-nav {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .nav-btn {
            padding: 8px 18px; background: var(--card-bg); border: 1px solid #cbd5e1;
            border-radius: 50px; color: var(--text-dark); text-decoration: none;
            font-size: 13px; font-weight: bold; transition: all 0.3s ease;
        }
        .nav-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(253, 58, 9, 0.2);
        }

        .main-container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; min-height: 78vh; }

        .map-section {
            flex: 1.6; background: var(--card-bg); border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative;
            align-self: flex-start; overflow: hidden;
        }

        .map-image { width: 100%; height: auto; display: block; }

        .city-spot {
            position: absolute; background: rgba(255, 255, 255, 0.95); padding: 5px 12px; 
            border-radius: 30px; font-size: 12px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: 0.2s;
            transform: translate(-50%, -50%); border: 1px solid #cbd5e1; z-index: 10;
        }

        .dh-num { color: var(--highlight-green); margin-left: 2px; font-size: 13px; }

        .city-spot:hover, .city-spot.active {
            background: var(--primary); color: white; transform: translate(-50%, -50%) scale(1.1);
            z-index: 20; border-color: var(--primary);
        }
        .city-spot:hover .dh-num, .city-spot.active .dh-num { color: #ffffff; }

        .info-section {
            flex: 1; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .info-header { padding: 15px; background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%); border-bottom: 1px solid #e2e8f0; }
        .city-title { font-size: 20px; margin: 0; font-weight: 800; }
        .city-hint { font-size: 12px; color: var(--text-gray); margin-top: 4px; }

        .info-body { padding: 12px; overflow-y: auto; flex: 1; }
        .info-body::-webkit-scrollbar { width: 4px; }
        .info-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .category-block { margin-bottom: 10px; }
        .category-name {
            background: #f1f5f9; padding: 10px 14px; border-radius: 8px; font-size: 13px;
            font-weight: 700; color: #334155; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center;
        }
        .category-name::after { content: '展开'; font-size: 10px; color: var(--text-gray); }
        .category-block.expanded .category-name::after { content: '收回'; }

        .school-list { display: none; padding-top: 8px; }
        .category-block.expanded .school-list { display: block; }

        .school-card {
            background: #f8fafc; border-radius: 8px; margin-bottom: 6px; border: 1px solid #edf2f7;
            padding: 10px; cursor: pointer;
        }
        .school-card:hover { border-color: var(--primary); }
        .school-card.undergrad-card { border-left: 4px solid #f97316; }

        .school-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: block; }
        .tag-row { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag { font-size: 9px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
        .tag-double-high { background: var(--tag-double-high-bg); color: var(--tag-double-high-text); }
        .tag-cat { background: var(--tag-cat-bg); color: var(--tag-cat-text); }
        .tag-type { background: var(--tag-type-bg); color: var(--tag-type-text); }
        .tag-level { background: var(--tag-level-bg); color: var(--tag-level-text); }

        .school-detail { display: none; font-size: 11px; color: #64748b; margin-top: 8px; border-top: 1px dashed #eee; padding-top: 8px; }

        .detail-label { width: 75px; display: inline-block; color: #94a3b8; }
        .detail-val { color: #334155; }

            { name: "湖北健康职业学院", city: "咸宁市", cat: "05医药院校", level: "高职专科", type: "民办", status: "在办", sponsor: "春来教育", sType: "民办" },
            { name: "湖北孝感美珈职业学院", city: "孝感市", cat: "02理工院校", level: "高职专科", type: "民办", status: "在办", sponsor: "乐群教育", sType: "民办" },
            { name: "襄阳科技职业学院", city: "襄阳市", cat: "02理工院校", level: "高职专科", type: "公办", status: "新办", sponsor: "湖北省", sType: "省级教育部门" },
            { name: "宜昌科技职业学院", city: "宜昌市", cat: "02理工院校", level: "高职专科", type: "公办", status: "新办", sponsor: "湖北省", sType: "地级教育部门" }
        ];

        const cityMap = {};
        const dhCityCount = {};

        rawData.forEach(item => {
            if (!cityMap[item.city]) cityMap[item.city] = [];
            cityMap[item.city].push(item);
            if(doubleHighNames.includes(item.name)) {
                dhCityCount[item.city] = (dhCityCount[item.city] || 0) + 1;
            }
        });

        function getSponsorLevelTag(school) {
            if (school.type === '民办') return '民办';
            if (school.sType && school.sType.includes('省级')) return '省级';
            return '地级';
        }

        function initMapLabels() {
            document.querySelectorAll('.city-spot').forEach(spot => {
                const cityName = spot.getAttribute('data-city');
                const count = dhCityCount[cityName] || 0;
                const shortName = spot.innerText;
                if(count > 0) {
                    spot.innerHTML = `✨ ${shortName}<span class="dh-num">${count}</span>`;
                }
            });
        }

        function render(cityName) {
            document.querySelectorAll('.city-spot').forEach(s => s.classList.remove('active'));
            const targetSpot = Array.from(document.querySelectorAll('.city-spot')).find(s => 
                s.getAttribute('data-city') === cityName
            );
            if(targetSpot) targetSpot.classList.add('active');

            const schools = cityMap[cityName] || [];
            const body = document.getElementById('info-body');
            document.getElementById('title-city').innerText = cityName;
            
            // 总数统计保持唯一计数
            document.getElementById('count-text').innerText = `📊 该区域共收录 ${schools.length} 所院校`;

            // 初始化分类容器
            const groups = {
                "职业本科": [],
                "双高院校": [],
                "公办专科": [],
                "民办专科": []
            };

            schools.forEach(s => {
                const isDH = doubleHighNames.includes(s.name.trim());
                const isU = s.level === "职业本科";

                // 分类投放逻辑
                if (isU) groups["职业本科"].push(s);
                if (isDH) groups["双高院校"].push(s);
                
                // 核心逻辑：只有【既不是本科】且【也不是双高】的学校，才进入“普通专科”分类
                if (!isU && !isDH) {
                    if (s.type === "公办") {
                        groups["公办专科"].push(s);
                    } else {
                        groups["民办专科"].push(s);
                    }
                }
            });

            const isBigCity = (cityName === '武汉市' || cityName === '宜昌市' || cityName === '襄阳市');
            let html = '';
            // 确保渲染顺序与容器 Key 完全一致
            const renderOrder = ["职业本科", "双高院校", "公办专科", "民办专科"];
            
            renderOrder.forEach(title => {
                const list = groups[title];
                if (list && list.length > 0) {
                    const expandedClass = (isBigCity && title !== "职业本科" && title !== "双高院校") ? '' : 'expanded';
                    
                    html += `
                    <div class="category-block ${expandedClass}" id="block-${title}">
                        <div class="category-name" onclick="toggleCategory('${title}')">
                            ${title} (${list.length})
                        </div>
                        <div class="school-list">
                            ${list.map(s => {
                                const isDH = doubleHighNames.includes(s.name.trim());
                                const isU = s.level === "职业本科";
                                const statusClass = s.status === '在办' ? 'status-zb' : (s.status === '新办' ? 'status-xb' : 'status-tb');
                                const levelTag = getSponsorLevelTag(s);

                                return `
                                <div class="school-card ${isU ? 'undergrad-card' : ''}" onclick="toggleSchool(this)">
                                    <span class="school-name">${s.name}</span>
                                    <div class="tag-row">
                                        ${isDH ? '<span class="tag tag-double-high">✨ 双高计划</span>' : ''}
                                        <span class="tag tag-cat">${s.cat.replace(/^\d+/, '')}</span>
                                        <span class="tag tag-type">${s.sType}</span>
                                        <span class="tag tag-level">${levelTag}</span>
                                    </div>
                                    <div class="school-detail">
                                        <div class="detail-item"><span class="detail-label">办学层次：</span><span class="detail-val">${s.level}</span></div>
                                        <div class="detail-item"><span class="detail-label">公/民办：</span><span class="detail-val">${s.type}</span></div>
                                        <div class="detail-item"><span class="detail-label">运行状态：</span><span class="detail-val"><span class="status-tag ${statusClass}">${s.status}</span></span></div>
                                        <div class="detail-item"><span class="detail-label">举办者：</span><span class="detail-val">${s.sponsor}</span></div>
                                        <div class="detail-item"><span class="detail-label">举办者类型：</span><span class="detail-val">${s.sType}</span></div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }
            });
            body.innerHTML = html || '<div style="text-align:center;color:#94a3b8;margin-top:40px;">暂无该地区数据</div>';
        }

        function toggleCategory(title) {
            const block = document.getElementById(`block-${title}`);
            if(block) block.classList.toggle('expanded');
        }

        function toggleSchool(el) {
            event.stopPropagation();
            el.classList.toggle('detail-active');
        }

        window.onload = () => {
            initMapLabels();
            render('武汉市');
        };
    </script>
</body>
